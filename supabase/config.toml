# Supabase project settings (used by `supabase link` / `supabase config push`).
# Database schema + RLS are NOT managed here: they come from packages/db/drizzle
# (`pnpm db:migrate` with DATABASE_URL pointing at the Supabase direct connection).
project_id = "photobooth-platform"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false
